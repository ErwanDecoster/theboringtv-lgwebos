<!doctype html>
<!-- Prints the start-up timings the app records (localStorage.perfMarks) a few seconds after it loads: chrome --headless --dump-dom .../marks.html?theme=tvos -->
<html><head><meta charset="utf-8"></head><body><pre id="out">waiting</pre><iframe id="tv" style="width:1920px;height:1080px;border:0"></iframe>
<script>
  var th = (/theme=(\w+)/.exec(location.search) || [])[1] || 'tvos', tv = document.getElementById('tv');
  tv.src = '../../index.html?theme=' + th;
  setTimeout(function () { try { document.getElementById('out').textContent = tv.contentWindow.localStorage.perfMarks || 'no marks'; } catch (e) { document.getElementById('out').textContent = 'error ' + e; } }, 9000);
</script></body></html>
