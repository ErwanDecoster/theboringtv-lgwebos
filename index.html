<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>TV Home</title>
<link rel="stylesheet" href="style.css" media="print" onload="this.media='all'">
<link rel="stylesheet" href="features/details.css" media="print" onload="this.media='all'">
<link rel="stylesheet" href="features/search.css" media="print" onload="this.media='all'">
<link rel="stylesheet" href="features/ambient.css" media="print" onload="this.media='all'">
<link rel="stylesheet" href="features/profiles.css" media="print" onload="this.media='all'">
<style>
/* Loading screen, inline so it paints before anything else loads (matters at boot). */
html, body { margin: 0; background: #0e1014; }
#boot { position: fixed; top: 0; left: 0; width: 1920px; height: 1080px; z-index: 20; background: #0e1014; overflow: hidden; transition: opacity .6s; }
#boot.gone { opacity: 0; }
#boot .sw { position: absolute; width: 1100px; height: 1100px; border-radius: 50%; opacity: .55; will-change: transform; }
#boot .s1 { background: radial-gradient(circle, rgba(138,180,248,.9) 0%, rgba(138,180,248,0) 65%); left: -200px; top: -300px; animation: sw1 9s ease-in-out infinite alternate; }
#boot .s2 { background: radial-gradient(circle, rgba(242,139,130,.85) 0%, rgba(242,139,130,0) 65%); right: -250px; top: 100px; animation: sw2 11s ease-in-out infinite alternate; }
#boot .s3 { background: radial-gradient(circle, rgba(129,201,149,.8) 0%, rgba(129,201,149,0) 65%); left: 300px; bottom: -500px; animation: sw3 10s ease-in-out infinite alternate; }
#boot .s4 { background: radial-gradient(circle, rgba(253,214,99,.7) 0%, rgba(253,214,99,0) 65%); right: 250px; bottom: -450px; animation: sw4 12s ease-in-out infinite alternate; }
@keyframes sw1 { to { transform: translate(380px, 220px) scale(1.15); } }
@keyframes sw2 { to { transform: translate(-420px, 160px) scale(.9); } }
@keyframes sw3 { to { transform: translate(260px, -280px) scale(1.2); } }
@keyframes sw4 { to { transform: translate(-300px, -200px) scale(1.1); } }
#boot .mid { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
#boot img { width: 150px; height: 150px; margin-bottom: 40px; }
#boot .bar { width: 240px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.15); overflow: hidden; }
#boot .bar i { display: block; width: 40%; height: 100%; border-radius: 2px; background: #fff; animation: bootbar 1.4s ease-in-out infinite; }
@keyframes bootbar { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
#bootmsg { margin-top: 24px; font: 22px "Google Sans", Roboto, Helvetica, Arial, sans-serif; color: rgba(255,255,255,.75); }
</style>
</head>
<body>
<div id="boot"><div class="sw s1"></div><div class="sw s2"></div><div class="sw s3"></div><div class="sw s4"></div><div class="mid"><img src="icon.svg" alt=""><div class="bar"><i></i></div><div id="bootmsg">Getting your shows ready…</div></div></div>
<div id="bg"><img id="bgA" alt=""><img id="bgB" alt=""></div>
<img id="bgBlur" alt="">
<div id="shade"></div>

<header id="top">
  <div class="avatar f" id="avatar"></div>
  <nav class="pill">
    <span class="tab f" data-tab="home">For you</span>
    <span class="tab f" data-act="live">Live</span>
    <span class="tab f" data-tab="apps">Apps</span>
  </nav>
  <nav class="pill icons"><span class="ico f" data-act="settings">
    <svg viewBox="0 0 24 24"><path fill="currentColor" d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.4 2.7a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1L11 21h4l.4-2.7c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5L19.4 13zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>
  </span></nav>
  <span id="weather" class="f" data-act="weather" hidden></span>
  <div id="clock"></div>
</header>

<main id="home">
  <section id="hero">
    <div id="heroSrc"></div>
    <h1 id="heroTitle"></h1>
    <div id="heroMeta"></div>
    <p id="heroSub"></p>
    <span id="heroBtn" class="f">Open</span>
    <div id="dots"></div>
  </section>
  <div id="rows"></div>
</main>

<main id="apps" hidden><h2>Your apps</h2><div id="grid"></div></main>

<div id="qdim" hidden></div>
<div id="qpanel" hidden><div id="quick">
  <div class="qrow qhead"><div class="qclock"><div id="qdate"></div><div id="qtime"></div></div>
    <span class="qbtn f" data-q="settings"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.4 2.7a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1L11 21h4l.4-2.7c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5L19.4 13zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg></span><span class="avatar f qav" data-q="close"></span></div>
  <div class="qrow"><span class="tile f" data-q="screensaver"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M21 19V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2zM8.5 13.5l2.5 3 3.5-4.5 4.5 6H5l3.5-4.5z"/></svg><span class="tl"><b>Screensaver</b></span></span><span class="tile f" data-q="wifi"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 21l3.6-4.8a6 6 0 0 0-7.2 0zM1 9l2 2a12.7 12.7 0 0 1 18 0l2-2A15.5 15.5 0 0 0 1 9zm4 4 2 2a7 7 0 0 1 10 0l2-2a9.9 9.9 0 0 0-14 0z"/></svg><span class="tl"><b>Wi-Fi</b><small id="qwifi"></small></span></span></div>
  <div class="qrow"><span class="tile f" data-q="screenoff"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M21 3H3a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h7v2H8v2h8v-2h-2v-2h7a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm0 13H3V5h18v11zM5.3 6.7l1.4-1.4 12 12-1.4 1.4z"/></svg><span class="tl"><b>Screen off</b><small>Audio keeps playing</small></span></span><span class="tile f" data-q="a11y"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a2 2 0 1 1 0 4 2 2 0 0 1 0-4zm9 7h-6v13h-2v-6h-2v6H9V9H3V7h18v2z"/></svg><span class="tl"><b>Accessibility</b></span></span></div>
  <div class="qrow"><span class="tile f" data-q="audio"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 3a9 9 0 0 0-9 9v7a2 2 0 0 0 2 2h3v-8H5v-1a7 7 0 0 1 14 0v1h-3v8h3a2 2 0 0 0 2-2v-7a9 9 0 0 0-9-9z"/></svg><span class="tl"><b>Audio output</b><small id="qaudio"></small></span></span><span class="tile f" data-q="bluetooth"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M17.7 7.7 12 2h-1v7.6L6.4 5 5 6.4 10.6 12 5 17.6 6.4 19l4.6-4.6V22h1l5.7-5.7-4.3-4.3 4.3-4.3zM13 5.8l1.9 1.9L13 9.6V5.8zm1.9 10.5L13 18.2v-3.8l1.9 1.9z"/></svg><span class="tl"><b>Bluetooth</b><small id="qbt"></small></span></span></div>
  <div class="qrow qvol"><span class="tile f vbtn" data-q="voldown">&minus;</span><div class="vlabel">Volume <b id="qvol">&ndash;</b></div><span class="tile f vbtn" data-q="volup">+</span></div>
  <div class="qrow"><span class="tile f" data-q="picture"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm1 15.9V5.1a7 7 0 0 1 0 13.8z"/></svg><span class="tl"><b>Picture</b><small id="qpic"></small></span></span><span class="tile f" data-q="sound"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg><span class="tl"><b>Sound mode</b><small id="qsnd"></small></span></span></div>
  <div class="qrow qvol"><span class="tile f vbtn" data-q="bldown">&minus;</span><div class="vlabel">Brightness <b id="qbl">&ndash;</b></div><span class="tile f vbtn" data-q="blup">+</span></div>
  <div class="qrow qinputs" id="qinputs"></div>
  <div class="qfoot">TV Home</div>
</div></div>
<div id="sdim" hidden></div>
<div id="spanel" hidden><div id="settings"></div></div>
<div id="toast"></div>
<script src="keys.js"></script>
<script src="config.js"></script>
<script src="features/profiles.js"></script>
<script src="app.js"></script>
<script src="features/details.js"></script>
<script src="features/search.js"></script>
<script src="features/ambient.js"></script>
</body>
</html>
