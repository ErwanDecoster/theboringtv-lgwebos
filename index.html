<style>
/* Loading screen, inline so it paints before anything else loads (matters at boot).
   Pure black (OLED pixels off), the logo exactly where and how big webOS's own launch image (splash.png) draws it, so the hand-over is invisible.
   Nothing but opacity and transform ever moves, and the bar and the message only appear if loading takes more than ~1 s. */
html, body { margin: 0; background: #000; }
#boot { position: fixed; top: 0; left: 0; width: 1920px; height: 1080px; z-index: 20; background: #000; overflow: hidden; transition: opacity .45s; }
#boot.gone { opacity: 0; }
#boot .mid { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
#boot .mark { width: 160px; height: 149px; display: block; animation: bootbreath 2.6s ease-in-out 1s infinite; }
@keyframes bootbreath { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
#boot .bar { position: absolute; top: 654px; left: 880px; width: 160px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.14); overflow: hidden; opacity: 0; animation: bootin .6s ease 1.2s forwards; }
#boot .bar i { display: block; width: 40%; height: 100%; border-radius: 2px; background: #fff; animation: bootbar 1.5s ease-in-out infinite; }
@keyframes bootbar { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
@keyframes bootin { to { opacity: 1; } }
#bootmsg { position: absolute; top: 690px; left: 0; width: 100%; text-align: center; font: 600 24px -apple-system, "SF Pro Text", "Helvetica Neue", "Google Sans", Roboto, Helvetica, Arial, sans-serif;
  letter-spacing: -.01em; color: rgba(255,255,255,.62); opacity: 0; animation: bootin .6s ease 3s forwards; }
</style>
</head>
<body>
<div id="boot"><div class="mid">
  <svg class="mark" viewBox="96 126 320 298" aria-hidden="true">
    <defs><linearGradient id="bootscr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e0ae78"/><stop offset=".55" stop-color="#b9743f"/><stop offset="1" stop-color="#7a432a"/></linearGradient>
    <linearGradient id="boothi" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".30"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="bootclip"><rect x="108" y="138" width="296" height="200" rx="46"/></clipPath></defs>
    <rect x="108" y="138" width="296" height="200" rx="46" fill="url(#bootscr)"/>
    <g clip-path="url(#bootclip)"><rect x="108" y="138" width="296" height="110" fill="url(#boothi)"/></g>
    <circle cx="256" cy="396" r="16" fill="#f1dfc4"/>
  </svg>
  <div class="bar"><i></i></div><div id="bootmsg">Getting your shows ready...</div>
</div></div>

  <div class="qrow"><span class="tile f" data-q="audio"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 3a9 9 0 0 0-9 9v7a2 2 0 0 0 2 2h3v-8H5v-1a7 7 0 0 1 14 0v1h-3v8h3a2 2 0 0 0 2-2v-7a9 9 0 0 0-9-9z"/></svg><span class="tl"><b>Audio output</b><small id="qaudio"></small></span></span><span class="tile f" data-q="bluetooth"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M17.7 7.7 12 2h-1v7.6L6.4 5 5 6.4 10.6 12 5 17.6 6.4 19l4.6-4.6V22h1l5.7-5.7-4.3-4.3 4.3-4.3zM13 5.8l1.9 1.9L13 9.6V5.8zm1.9 10.5L13 18.2v-3.8l1.9 1.9z"/></svg><span class="tl"><b>Bluetooth</b><small id="qbt"></small></span></span></div>
  <div class="qrow qvol"><span class="tile f vbtn" data-q="voldown">&minus;</span><div class="vlabel">Volume <b id="qvol">&ndash;</b></div><span class="tile f vbtn" data-q="volup">+</span></div>
  <div class="qrow"><span class="tile f" data-q="picture"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm1 15.9V5.1a7 7 0 0 1 0 13.8z"/></svg><span class="tl"><b>Picture</b><small id="qpic"></small></span></span><span class="tile f" data-q="sound"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg><span class="tl"><b>Sound mode</b><small id="qsnd"></small></span></span></div>
  <div class="qrow qvol"><span class="tile f vbtn" data-q="bldown">&minus;</span><div class="vlabel">Brightness <b id="qbl">&ndash;</b></div><span class="tile f vbtn" data-q="blup">+</span></div>
  <div class="qrow qinputs" id="qinputs"></div>
  <div class="qfoot">TV Home</div>
</div></div>
